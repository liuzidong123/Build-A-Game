<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>围棋 · 19 路对弈与电脑对战</title>
<meta name="description" content="标准 19 路围棋：黑先、提子、禁自杀、打劫禁手与连续虚手后数子，支持人机对战与同屏双人。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">碁</span>
      <div>
        <h1>围棋</h1>
        <p class="brand-sub">19 路 · 黑先 · 数子法 · 双人同屏 / 人机对战</p>
      </div>
    </div>
    <div class="turn-chip" id="statusChip">
      <span class="turn-dot" id="turnDot" aria-hidden="true"></span>
      <span id="statusText">黑方落子</span>
    </div>
  </header>

  <main class="stage">
    <section class="board-area">
      <div class="board-frame">
        <div class="board" id="board" role="grid" aria-label="19 路围棋棋盘，点空交叉点落子">
          <svg class="grid" id="grid" viewBox="0 0 900 900" aria-hidden="true" preserveAspectRatio="none"></svg>
          <div class="points" id="points"></div>
        </div>
        <div class="result" id="result" hidden>
          <div class="result-card">
            <p class="result-kicker" id="resultKicker">本局结束</p>
            <h2 class="result-title" id="resultTitle">黑方胜</h2>
            <p class="result-copy" id="resultCopy"></p>
            <div class="result-actions">
              <button class="btn primary" id="againBtn" type="button">再来一局</button>
              <button class="btn" id="reviewBtn" type="button">看看棋盘</button>
            </div>
          </div>
        </div>
      </div>
      <p class="sr-only" id="liveStatus" aria-live="polite">黑方落子</p>
    </section>

    <aside class="panel">
      <div class="group">
        <span class="group-label">对战模式</span>
        <div class="seg" id="modeRow">
          <button class="seg-btn is-on" type="button" data-mode="ai">人机对战</button>
          <button class="seg-btn" type="button" data-mode="pvp">双人对弈</button>
        </div>
      </div>

      <div class="group" id="sideGroup">
        <span class="group-label">我方执子</span>
        <div class="seg" id="sideRow">
          <button class="seg-btn is-on" type="button" data-side="b">执黑先行</button>
          <button class="seg-btn" type="button" data-side="w">执白后行</button>
        </div>
      </div>

      <div class="group" id="levelGroup">
        <span class="group-label">电脑棋力</span>
        <div class="seg" id="levelRow">
          <button class="seg-btn" type="button" data-level="easy">简单</button>
          <button class="seg-btn is-on" type="button" data-level="normal">普通</button>
          <button class="seg-btn" type="button" data-level="hard">困难</button>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="newBtn" type="button">新开一局</button>
        <button class="btn" id="undoBtn" type="button">悔棋</button>
        <button class="btn" id="passBtn" type="button">虚手</button>
        <button class="btn" id="resignBtn" type="button">认输</button>
      </div>

      <div class="group">
        <div class="group-head">
          <span class="group-label">棋谱</span>
          <span class="group-note" id="moveCount">0 手</span>
        </div>
        <ol class="moves" id="moveList"><li class="moves-empty">还没有落子</li></ol>
      </div>

      <div class="group">
        <div class="group-head">
          <span class="group-label">提子</span>
          <span class="group-note" id="scoreNote">黑提 0 · 白提 0</span>
        </div>
        <div class="captured"><span class="cap-label">黑提</span><span class="cap-line" id="capB">0</span></div>
        <div class="captured"><span class="cap-label">白提</span><span class="cap-line" id="capW">0</span></div>
      </div>

      <div class="hud">
        <div class="hud-item"><b id="estimateVal">黑 0 · 白 7.5</b><span>盘面估算（含贴目，仅供参考）</span></div>
        <div class="hud-item"><b id="recVal">0 胜 0 和 0 负</b><span>人机战绩</span></div>
      </div>

      <p class="tip">点空交叉点落子，禁自杀与立即回提。双方连续虚手后按中国规则数子（黑贴 7.5 目）。U 悔棋，P 虚手。</p>
    </aside>
  </main>

  <footer class="foot">纯前端离线运行 · 19×19 共 361 个交叉点 · 含提子 / 打劫 / 禁自杀 / 虚手终局数子</footer>
</div>

<script src="logic.js"></script>
<script src="ai.js"></script>
<script src="game.js"></script>
</body>
</html>
